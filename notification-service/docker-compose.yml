version: '3.9'

services:
  auth-service:
    container_name: notification-service
    image: mirocinema/notification-service:dev
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production.local
    expose:
      - '9102'
    networks:
      - mirocinema

networks:
  mirocinema:
    external: true