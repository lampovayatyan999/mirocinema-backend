          name: payment-service
          type: web
          property: hostport
      - key: NOTIFICATION_GRPC_URL
        fromService:
          name: notification-service
          type: web
          property: hostport
      - key: REDIS_USER
        value: default
      - key: REDIS_PASSWORD
        value: redispasswordplaceholder
      - key: REDIS_HOST
        fromService:
          name: mirocinema-redis
          type: web
          property: host
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_DB
        value: 0
      - key: RMQ_URL
        value: amqp://localhost
      - key: MONGODB_URL
        value: mongodb://mirocinema:mongopassword123@mirocinema-mongodb:27017/mirocinema?authSource=admin

