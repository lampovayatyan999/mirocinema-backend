services:
  - type: web
    name: gateway-service
    runtime: docker
    plan: free
    dockerfilePath: ./gateway-service/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_PORT
        value: 4000
      - key: HTTP_PORT
        value: 4000
      - key: JWT_SECRET
        value: supersecretkey123
      - key: PASSPORT_SECRET_KEY
        value: supersecretpassportkey123
      - key: COOKIES_SECRET
        value: supersecretcookiessecret123
      - key: COOKIES_DOMAIN
        value: onrender.com
      - key: HTTP_HOST
        fromService:
          name: gateway-service
          type: web
          property: host
      - key: HTTP_CORS
        value: http://localhost:3000
      - key: AUTH_GRPC_URL
        fromService:
          name: auth-service
          type: web
          property: hostport
      - key: USERS_GRPC_URL
        fromService:
          name: users-service
          type: web
          property: hostport
      - key: MOVIE_GRPC_URL
        fromService:
          name: movie-service
          type: web
          property: hostport
      - key: THEATER_GRPC_URL
        fromService:
          name: theater-service
          type: web
          property: hostport
      - key: PAYMENT_GRPC_URL
        fromService:
          name: payment-service
          type: web
          property: hostport
      - key: BOOKING_GRPC_URL
