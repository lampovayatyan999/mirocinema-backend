services:
  - type: web
    name: gateway-service
    runtime: docker
    dockerfilePath: ./gateway-service/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_PORT
        value: 4000
      - key: HTTP_PORT
        value: 4000
      - key: JWT_SECRET
        value: supersecretkey123
      - key: PASSPORT_SECRET_KEY
        value: supersecretpassportkey123
      - key: COOKIES_SECRET
        value: supersecretcookiessecret123
      - key: COOKIES_DOMAIN
        value: onrender.com
      - key: HTTP_HOST
        fromService:
          name: gateway-service
          type: web
          property: host
      - key: HTTP_CORS
        value: http://localhost:3000
      - key: AUTH_GRPC_URL
        fromService:
          name: auth-service
          type: pserv
          property: hostport
      - key: USERS_GRPC_URL
        fromService:
          name: users-service
          type: pserv
          property: hostport
      - key: MOVIE_GRPC_URL
        fromService:
          name: movie-service
          type: pserv
          property: hostport
      - key: THEATER_GRPC_URL
        fromService:
          name: theater-service
          type: pserv
          property: hostport
      - key: PAYMENT_GRPC_URL
        fromService:
          name: payment-service
          type: pserv
          property: hostport
      - key: BOOKING_GRPC_URL
        fromService:
          name: booking-service
          type: pserv
          property: hostport
      - key: MEDIA_GRPC_URL
        fromService:
          name: media-service
          type: pserv
          property: hostport
      - key: CATEGORY_GRPC_URL
        fromService:
          name: movie-service
          type: pserv
          property: hostport
      - key: HALL_GRPC_URL
        fromService:
          name: theater-service
          type: pserv
          property: hostport
      - key: SCREENING_GRPC_URL
        fromService:
          name: screening-service
          type: pserv
          property: hostport
      - key: REFUND_GRPC_URL
        fromService:
          name: payment-service
          type: pserv
          property: hostport
      - key: NOTIFICATION_GRPC_URL
        fromService:
          name: notification-service
          type: pserv
          property: hostport

  - type: pserv
    name: auth-service
    runtime: docker
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: GRPC_HOST
        value: 0.0.0.0
      - key: GRPC_PORT
        value: 50051
      - key: DATABASE_URL
        fromDatabase:
          name: mirocinema-postgres
          property: connectionString
      - key: PASSPORT_SECRET_KEY
        value: supersecretpassportkey123
      - key: PASSPORT_ACCESS_TTL
        value: 900
      - key: PASSPORT_REFRESH_TTL
        value: 2592000
      - key: JWT_SECRET
        value: supersecretkey123
      - key: JWT_EXPIRATION
        value: 3600

  - type: pserv
    name: users-service
    runtime: docker
    dockerfilePath: ./users-service/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: GRPC_HOST
        value: 0.0.0.0
      - key: GRPC_PORT
        value: 50052
      - key: DATABASE_URL
        fromDatabase:
          name: mirocinema-postgres
          property: connectionString

  - type: pserv
    name: movie-service
    runtime: docker
    dockerfilePath: ./movie-service/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: GRPC_HOST
        value: 0.0.0.0
      - key: GRPC_PORT
        value: 50054
      - key: DATABASE_URL
        fromDatabase:
