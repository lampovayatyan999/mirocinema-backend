      - key: GRPC_PORT
        value: 50055
      - key: DATABASE_URL
        fromDatabase:
          name: mirocinema-postgres
          property: connectionString

  - type: pserv
    name: screening-service
    runtime: docker
    dockerfilePath: ./screening-service/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: GRPC_HOST
        value: 0.0.0.0
      - key: GRPC_PORT
        value: 50057
      - key: DATABASE_URL
        fromDatabase:
          name: mirocinema-postgres
          property: connectionString

  - type: pserv
    name: booking-service
    runtime: docker
    dockerfilePath: ./booking-service/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: GRPC_HOST
        value: 0.0.0.0
      - key: GRPC_PORT
        value: 50058
      - key: DATABASE_URL
        fromDatabase:
          name: mirocinema-postgres
          property: connectionString

  - type: pserv
    name: payment-service
    runtime: docker
    dockerfilePath: ./payment-service/Dockerfile
