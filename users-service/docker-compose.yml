version: '3.9'

services:
  auth-service:
    container_name: users-service
    image: mirocinema/users-service:dev
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production.local
    networks:
      - mirocinema

networks:
  mirocinema:
    external: true